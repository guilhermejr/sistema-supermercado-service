services:
  supermercado-service:
    image: guilhermejr/sistema-supermercado-service
    container_name: supermercado-service
    restart: always
    env_file: /home/guilhermejr/secrets/supermercado-service.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9005:9005"

networks:
  default:
    external: true
    name: rede